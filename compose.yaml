services:
  backend:
    image: mywall-backend:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend-data:/data
    environment:
      ALLOWED_ORIGINS: https://epfl-bsa-hackathon-web.vercel.app
      WEBAUTHN_RP_ID: epfl-bsa-hackathon-web.vercel.app
      WEBAUTHN_ORIGIN: https://epfl-bsa-hackathon-web.vercel.app
      INDEXER_RPC_URLS: https://ethereum-sepolia-rpc.publicnode.com,https://sepolia.drpc.org
volumes:
  backend-data:
